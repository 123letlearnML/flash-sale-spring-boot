name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (MySQL thật)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # Trong CI, app kết nối từ ngoài container nên user 'devuser'@'localhost' không khớp => dùng root.
      DB_USER: root
      DB_PASSWORD: root
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/flash_sale_test?allowPublicKeyRetrieval=true&useSSL=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tạo database
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot < scripts/mysql-setup.sql
      - name: Test đồng thời
        working-directory: backend
        run: ./mvnw -B -ntp test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
