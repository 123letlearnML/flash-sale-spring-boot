spring:
  application:
    name: flash-sale

  datasource:
    # Chỉ dùng cho môi trường dev local. Production: lấy từ biến môi trường / secret manager.
    url: ${DB_URL:jdbc:mysql://localhost:3306/flash_sale?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:devuser}
    password: ${DB_PASSWORD:devuser_local_123}
    hikari:
      # Số connection tới DB. Không phải càng nhiều càng tốt — xem KNOWLEDGE.md mục "Connection pool".
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Chờ lấy connection tối đa 5s rồi báo lỗi (fail fast) thay vì treo 30s mặc định.
      connection-timeout: 5000

  jpa:
    # Tắt OSIV: không giữ connection DB suốt cả request HTTP.
    open-in-view: false
    hibernate:
      # Flyway là nguồn sự thật cho schema; Hibernate chỉ kiểm tra entity có khớp bảng không.
      ddl-auto: validate

  # Java 21 virtual threads: mỗi request 1 virtual thread, chịu được hàng chục nghìn request chờ IO.
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

flashsale:
  optimistic:
    max-retries: ${OPTIMISTIC_MAX_RETRIES:10}
